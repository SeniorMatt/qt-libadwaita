name: libadwaita update

# Weekly: if GNOME released a newer libadwaita than the token file in data/current, regenerate the tokens
# and open a pull request with the value diff. Needs "Allow GitHub Actions to create and approve pull requests"
# (Settings > Actions > General > Workflow permissions) to be enabled.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: "libadwaita tag or branch to use instead of the newest release (e.g. 1.10.1, main)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ qt6-base-dev libgl1-mesa-dev python3-pip python3-venv

      - name: Find the newest libadwaita release
        id: check
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          python3 tools/update_libadwaita.py --check | tee check.txt
          cat check.txt >> "$GITHUB_OUTPUT"
          ref="$INPUT_REF"
          if [ -z "$ref" ]; then ref=$(sed -n 's/^latest=//p' check.txt); fi
          # only plain tag / branch names go on
          case "$ref" in *[!A-Za-z0-9._-]*|"") echo "bad ref"; exit 1;; esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if [ -n "$INPUT_REF" ] || [ "$(sed -n 's/^newer=//p' check.txt)" = true ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update tokens, regenerate files, build
        if: steps.check.outputs.run == 'true'
        env:
          REF: ${{ steps.check.outputs.ref }}
        run: |
          python3 tools/update_libadwaita.py "$REF" --apply --cache "$RUNNER_TEMP/cache" \
            --build-dir "$RUNNER_TEMP/build" --report "$RUNNER_TEMP/report.md"

      - name: Open the pull request
        if: steps.check.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ steps.check.outputs.ref }}
        run: |
          if [ -z "$(git status --porcelain data src)" ]; then
            echo "nothing changed"; exit 0
          fi
          branch="libadwaita-update-$REF"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add data src
          git commit -m "Update libadwaita tokens to $REF"
          git push --force origin "$branch"
          {
            cat "$RUNNER_TEMP/report.md"
            echo
            echo "---"
            echo "Generated by tools/update_libadwaita.py. Before merging, follow docs/updating-libadwaita.md"
            echo "(gallery check, visual comparison against fresh reference shots, the manual keys listed above)."
          } > "$RUNNER_TEMP/body.md"
          if gh pr view "$branch" >/dev/null 2>&1; then
            gh pr edit "$branch" --title "Update libadwaita tokens to $REF" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$branch" --title "Update libadwaita tokens to $REF" --body-file "$RUNNER_TEMP/body.md"
          fi
