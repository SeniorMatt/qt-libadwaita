name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tarball:
    name: tarball ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # Debian 12 has the oldest glibc (2.36) and Qt (6.4) we support, so the plugin runs on newer systems too.
    container: debian:12
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install dependencies
        run: apt-get update && apt-get install -y build-essential cmake git ca-certificates curl xz-utils qt6-base-dev qtbase5-dev
      - uses: actions/checkout@v4
      - name: Build the tarball
        run: |
          export RELEASE_VERSION=${GITHUB_REF_NAME#v}
          tools/make_release.sh "$PWD/dist"
          ls -l dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}
          path: dist/*.tar.gz

  publish:
    needs: tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum *.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Unpack, then run ./install.sh --enable. See docs/install.md inside the archive." \
            *.tar.gz SHA256SUMS
